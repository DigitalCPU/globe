<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GhostProtocol</title>
  <link rel="stylesheet" href="styles.css?v=command-mode1">
  <link rel="stylesheet" href="keyboard.css?v=keyboard2">
</head>
<body>
  <main class="terminal" aria-label="GhostProtocol terminal">
    <header class="terminal-header">
      <div>
        <div class="terminal-title">
          <strong id="appTitle">Ghost Protocol</strong>
          <button id="keyboardToggle" type="button" aria-label="Toggle keyboard" aria-controls="virtualKeyboard" aria-expanded="false" title="Toggle keyboard">[::::]</button>
        </div>
        <span id="connectionState">offline</span>
        <span id="terminalHint" class="terminal-hint">type 'help' to access terminal</span>
      </div>
      <div class="terminal-session">
        <div class="terminal-window-controls" aria-label="Terminal window controls">
          <button id="windowMinimize" type="button" aria-label="Command mode" title="Command mode">_</button>
          <button id="windowRestore" type="button" aria-label="Windowed">[ ]</button>
          <button id="windowFullscreen" type="button" aria-label="Full immersion">[o]</button>
          <button id="windowClose" type="button" aria-label="Close tab" title="Close tab (when permitted by the browser)">[x]</button>
        </div>
        <span id="sessionState">guest</span>
      </div>
    </header>
    <section id="virtualKeyboard" class="virtual-keyboard" aria-label="Virtual keyboard" hidden></section>
    <section class="terminal-screen" id="screen" aria-live="polite"></section>
    <form class="terminal-input" id="commandForm">
      <label for="commandInput">&gt;</label>
      <input id="commandInput" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus>
      <button type="submit">enter</button>
    </form>
  </main>
  <input id="fileInput" type="file" hidden>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <script src="modules/core.js?v=clear-lobby1"></script>
  <script src="modules/keyboard.js?v=command-mode1"></script>
  <script src="modules/ui.js?v=command-mode1"></script>
  <script src="modules/control.js?v=structure1"></script>
  <script src="modules/auth.js?v=clear-lobby1"></script>
  <script src="modules/files.js?v=structure1"></script>
  <script src="modules/files/core.js?v=structure1"></script>
  <script src="modules/files/preview.js?v=structure1"></script>
  <script src="modules/files/analysis.js?v=structure1"></script>
  <script src="modules/files/database.js?v=database-nav3"></script>
  <script src="modules/board.js?v=board-clear1"></script>
  <script src="modules/chat/options.js?v=status1"></script>
  <script src="modules/chat/voice-playback.js?v=database-nav1"></script>
  <script src="modules/chat.js?v=database-nav1"></script>
  <script src="modules/lobby.js?v=clear-lobby1"></script>
  <script src="modules/profiles.js?v=structure1"></script>
  <script src="modules/profiles/core.js?v=structure1"></script>
  <script src="modules/profiles/connections.js?v=structure1"></script>
  <script src="modules/profiles/view.js?v=structure1"></script>
  <script src="modules/profiles/edit.js?v=structure1"></script>
  <script src="modules/mail.js?v=structure1"></script>
  <script src="modules/eva.js?v=evathinking1"></script>
  <script src="modules/app.js?v=command-mode1"></script>
</body>
</html>
