<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wire Mesh Earth</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020406;
      color: #d8f7ff;
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #container.dragging {
      cursor: grabbing;
    }

    .info,
    .credits {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(63, 213, 255, 0.45);
    }

    .info {
      left: 16px;
      top: 14px;
      max-width: calc(100% - 32px);
      font-size: 13px;
      color: rgba(216, 247, 255, 0.72);
    }

    .credits {
      right: 16px;
      bottom: 14px;
      font-size: 12px;
      color: rgba(216, 247, 255, 0.48);
    }

    .clock {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 2;
      transform: translateX(-50%);
      color: rgba(216, 247, 255, 0.78);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(63, 213, 255, 0.45);
      white-space: nowrap;
    }

    .panel {
      position: absolute;
      left: 14px;
      top: 54px;
      z-index: 3;
      width: 218px;
      padding: 12px;
      border: 1px solid rgba(84, 218, 255, 0.26);
      border-radius: 8px;
      background: rgba(2, 8, 12, 0.74);
      box-shadow: 0 0 22px rgba(42, 205, 255, 0.12);
      color: rgba(216, 247, 255, 0.86);
      font-size: 12px;
      pointer-events: auto;
      backdrop-filter: blur(7px);
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
    }

    .control {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .control label,
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .control-value,
    .readout {
      color: rgba(137, 239, 255, 0.92);
      font-family: Consolas, "Courier New", monospace;
    }

    .panel input[type="range"] {
      width: 100%;
      accent-color: #4bd6ff;
    }

    .panel input[type="checkbox"] {
      accent-color: #4bd6ff;
    }

    .panel select {
      width: 100%;
      min-height: 30px;
      border: 1px solid rgba(84, 218, 255, 0.32);
      border-radius: 6px;
      background: rgba(2, 18, 24, 0.92);
      color: rgba(230, 252, 255, 0.95);
      font: inherit;
    }

    .panel button {
      width: 100%;
      min-height: 30px;
      border: 1px solid rgba(84, 218, 255, 0.32);
      border-radius: 6px;
      background: rgba(18, 70, 84, 0.52);
      color: rgba(230, 252, 255, 0.95);
      font: inherit;
      cursor: pointer;
    }

    .panel button:hover {
      background: rgba(30, 102, 122, 0.64);
    }

    .readout {
      display: grid;
      gap: 3px;
      padding-top: 4px;
      font-size: 11px;
      line-height: 1.35;
    }

    .hover-label {
      position: absolute;
      z-index: 4;
      display: none;
      max-width: 240px;
      padding: 6px 8px;
      border: 1px solid rgba(84, 218, 255, 0.28);
      border-radius: 6px;
      background: rgba(1, 9, 13, 0.86);
      color: rgba(222, 251, 255, 0.96);
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(63, 213, 255, 0.35);
      white-space: nowrap;
    }

    canvas {
      display: block;
    }

    @media (max-width: 520px) {
      .info {
        left: 12px;
        top: 10px;
        font-size: 11px;
      }

      .credits {
        right: 12px;
        bottom: 10px;
        font-size: 11px;
      }

      .clock {
        bottom: 28px;
        font-size: 11px;
      }

      .panel {
        left: 10px;
        top: 42px;
        width: min(210px, calc(100% - 20px));
        padding: 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="info">Left-click and drag to rotate the solar model - wheel to zoom</div>
    <section class="panel" aria-label="Simulation controls">
      <h2 class="panel-title">Controls</h2>

      <div class="control">
        <label for="timeScale">
          <span>Time speed</span>
          <span class="control-value" id="timeScaleValue">3600x</span>
        </label>
        <input id="timeScale" type="range" min="0" max="6" step="1" value="4">
      </div>

      <div class="control">
        <label class="toggle" for="actualTime">
          <span>Match actual time</span>
          <input id="actualTime" type="checkbox">
        </label>
      </div>

      <div class="control">
        <label class="toggle" for="distanceLines">
          <span>Distance lines</span>
          <input id="distanceLines" type="checkbox" checked>
        </label>
      </div>

      <div class="control">
        <label class="toggle" for="satellites">
          <span>Satellites</span>
          <input id="satellites" type="checkbox" checked>
        </label>
      </div>

      <div class="control">
        <label for="satelliteSource">
          <span>Satellite data</span>
        </label>
        <select id="satelliteSource">
          <option value="local-starlink">Local Starlink TLE</option>
          <option value="fallback">Visual fallback</option>
          <option value="active-live">CelesTrak active TLE</option>
          <option value="starlink-live">CelesTrak Starlink TLE</option>
        </select>
      </div>

      <div class="control">
        <button id="slowTime" type="button">Slow down time</button>
      </div>

      <div class="control">
        <button id="earthFocus" type="button">Return to Earth</button>
      </div>

      <div class="control">
        <span>Sun to Earth</span>
        <div class="readout">
          <span id="sunDirection">direction --</span>
          <span id="sunDistance">distance --</span>
          <span id="satelliteStatus">satellites --</span>
          <span id="selectedSatellite">selected none</span>
        </div>
      </div>
    </section>
    <div class="clock" id="clock">--/--/--/--/--/--</div>
    <div class="hover-label" id="hoverLabel"></div>
    <div class="credits">DigitalCPU / globe</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5/dist/satellite.min.js"></script>

  <script>
    const container = document.getElementById('container');
    const clock = document.getElementById('clock');
    const timeScaleInput = document.getElementById('timeScale');
    const timeScaleValue = document.getElementById('timeScaleValue');
    const actualTimeInput = document.getElementById('actualTime');
    const distanceLinesInput = document.getElementById('distanceLines');
    const satellitesInput = document.getElementById('satellites');
    const satelliteSourceInput = document.getElementById('satelliteSource');
    const slowTimeButton = document.getElementById('slowTime');
    const earthFocusButton = document.getElementById('earthFocus');
    const sunDirection = document.getElementById('sunDirection');
    const sunDistance = document.getElementById('sunDistance');
    const satelliteStatus = document.getElementById('satelliteStatus');
    const selectedSatellite = document.getElementById('selectedSatellite');
    const hoverLabel = document.getElementById('hoverLabel');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020406);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100000);
    camera.position.set(0, 0, 4.2);

    const solarSystem = new THREE.Group();
    solarSystem.position.x = 0;
    solarSystem.rotation.x = THREE.MathUtils.degToRad(-12);
    solarSystem.rotation.y = THREE.MathUtils.degToRad(-16);
    scene.add(solarSystem);

    const earthSystem = new THREE.Group();
    solarSystem.add(earthSystem);

    const earth = new THREE.Group();
    earth.rotation.set(-0.28, -0.55, 0.12);
    earthSystem.add(earth);

    scene.add(new THREE.AmbientLight(0x80dfff, 0.35));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(4, 2.5, 5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x1fb8ff, 1.1);
    rimLight.position.set(-5, 1, -3);
    scene.add(rimLight);

    const radius = 1.42;
    const moonRadius = radius * 0.2727;
    const moonDistance = radius * 4.15;
    const moonOrbitEccentricity = 0.0549;
    const moonOrbitInclination = THREE.MathUtils.degToRad(5.145);
    const sunRadiusRatioToEarth = 109.1;
    const astronomicalUnitInEarthRadii = 23454.8;
    const sunDisplayRadius = radius * sunRadiusRatioToEarth;
    const earthSunDistance = radius * astronomicalUnitInEarthRadii;
    const earthSunEccentricity = 0.0167;
    const eclipticTilt = THREE.MathUtils.degToRad(7.155);
    const sphereGeometry = new THREE.SphereGeometry(radius, 48, 32);
    let zoomOffset = 0;

    function getDefaultCameraZ() {
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const sceneWidth = moonDistance + radius + moonRadius;
      const distanceToFitWidth = (sceneWidth * 1.34) / (2 * Math.tan(verticalFov / 2) * camera.aspect);
      const distanceToFitEarth = (radius * 2.24) / (2 * Math.tan(verticalFov / 2) * camera.aspect);
      return Math.max(7.2, distanceToFitWidth, distanceToFitEarth);
    }

    function applyCameraDistance() {
      camera.position.z = THREE.MathUtils.clamp(getDefaultCameraZ() + zoomOffset, 2.25, 36);
    }

    applyCameraDistance();

    const sun = new THREE.Group();
    solarSystem.add(sun);

    const sunShell = new THREE.Mesh(
      new THREE.SphereGeometry(sunDisplayRadius, 64, 48),
      new THREE.MeshBasicMaterial({
        color: 0xffc94a,
        transparent: true,
        opacity: 0.88
      })
    );
    sun.add(sunShell);

    const sunWire = new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.SphereGeometry(sunDisplayRadius * 1.006, 36, 24)),
      new THREE.LineBasicMaterial({
        color: 0xfff2a6,
        transparent: true,
        opacity: 0.18
      })
    );
    sun.add(sunWire);

    const sunGlow = new THREE.Mesh(
      new THREE.SphereGeometry(sunDisplayRadius * 1.35, 64, 48),
      new THREE.MeshBasicMaterial({
        color: 0xff8a28,
        transparent: true,
        opacity: 0.13,
        side: THREE.BackSide
      })
    );
    sun.add(sunGlow);

    function earthSunOrbitPoint(angle) {
      const semiMajor = earthSunDistance;
      const semiMinor = semiMajor * Math.sqrt(1 - earthSunEccentricity * earthSunEccentricity);
      const focusOffset = semiMajor * earthSunEccentricity;
      return new THREE.Vector3(
        Math.cos(angle) * semiMajor - focusOffset,
        Math.sin(angle) * semiMinor * Math.sin(eclipticTilt),
        Math.sin(angle) * semiMinor * Math.cos(eclipticTilt)
      );
    }

    const shell = new THREE.Mesh(
      sphereGeometry,
      new THREE.MeshStandardMaterial({
        color: 0x07151c,
        emissive: 0x031018,
        roughness: 0.55,
        metalness: 0.18,
        transparent: true,
        opacity: 0.2
      })
    );
    earth.add(shell);

    const wire = new THREE.LineSegments(
      new THREE.WireframeGeometry(sphereGeometry),
      new THREE.LineBasicMaterial({
        color: 0x4bd6ff,
        transparent: true,
        opacity: 0.26
      })
    );
    earth.add(wire);

    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 1.012, 48, 32),
      new THREE.MeshBasicMaterial({
        color: 0x0aa8ff,
        transparent: true,
        opacity: 0.055,
        side: THREE.BackSide
      })
    );
    earth.add(glow);

    const moonOrbitPlane = new THREE.Group();
    moonOrbitPlane.rotation.x = moonOrbitInclination;
    earthSystem.add(moonOrbitPlane);

    function moonOrbitPoint(angle) {
      const semiMajor = moonDistance;
      const semiMinor = semiMajor * Math.sqrt(1 - moonOrbitEccentricity * moonOrbitEccentricity);
      const focusOffset = semiMajor * moonOrbitEccentricity;
      return new THREE.Vector3(
        Math.cos(angle) * semiMajor - focusOffset,
        0,
        Math.sin(angle) * semiMinor
      );
    }

    const moon = new THREE.Group();
    moon.position.copy(moonOrbitPoint(0.1));
    moonOrbitPlane.add(moon);

    const moonGeometry = new THREE.SphereGeometry(moonRadius, 32, 24);
    const moonShell = new THREE.Mesh(
      moonGeometry,
      new THREE.MeshStandardMaterial({
        color: 0x9fb4bd,
        emissive: 0x10191d,
        roughness: 0.85,
        metalness: 0.05,
        transparent: true,
        opacity: 0.45
      })
    );
    moon.add(moonShell);

    const moonWire = new THREE.LineSegments(
      new THREE.WireframeGeometry(moonGeometry),
      new THREE.LineBasicMaterial({
        color: 0xc9f4ff,
        transparent: true,
        opacity: 0.34
      })
    );
    moon.add(moonWire);

    const moonGlow = new THREE.Mesh(
      new THREE.SphereGeometry(moonRadius * 1.08, 32, 24),
      new THREE.MeshBasicMaterial({
        color: 0x9ddfff,
        transparent: true,
        opacity: 0.06,
        side: THREE.BackSide
      })
    );
    moon.add(moonGlow);

    function moonLatLonToVector(lat, lon, scale = moonRadius * 1.018) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      return new THREE.Vector3(
        -scale * Math.sin(phi) * Math.cos(theta),
        scale * Math.cos(phi),
        scale * Math.sin(phi) * Math.sin(theta)
      );
    }

    function makeMoonSurfaceRing(lat, lon, diameterKm, color, opacity, segments = 64) {
      const lunarRadiusKm = 1737.4;
      const angularRadius = (diameterKm * 0.5) / lunarRadiusKm;
      const featureRadius = moonRadius * Math.sin(angularRadius);
      const center = moonLatLonToVector(lat, lon, moonRadius * 1.018).normalize();
      const tangent = new THREE.Vector3(0, 1, 0).cross(center);
      if (tangent.lengthSq() < 0.0001) tangent.set(1, 0, 0);
      tangent.normalize();
      const bitangent = center.clone().cross(tangent).normalize();
      const points = [];

      for (let i = 0; i <= segments; i += 1) {
        const angle = (i / segments) * Math.PI * 2;
        const point = center.clone()
          .multiplyScalar(moonRadius * 1.019)
          .add(tangent.clone().multiplyScalar(Math.cos(angle) * featureRadius))
          .add(bitangent.clone().multiplyScalar(Math.sin(angle) * featureRadius))
          .normalize()
          .multiplyScalar(moonRadius * 1.02);
        points.push(point);
      }

      return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({
          color,
          transparent: true,
          opacity
        })
      );
    }

    [
      [32.8, -15.6, 1145],
      [28.0, 17.5, 674],
      [8.5, 31.4, 876],
      [17.0, 59.1, 556],
      [-7.8, 51.3, 840],
      [-15.2, 16.0, 333],
      [-21.3, -16.6, 715],
      [-24.4, -38.6, 419],
      [56.0, 1.4, 1596],
      [-13.3, -16.8, 603]
    ].forEach(([lat, lon, diameterKm]) => {
      moon.add(makeMoonSurfaceRing(lat, lon, diameterKm, 0x6fb8c4, 0.2, 96));
    });

    [
      [-43.3, -11.2, 85],
      [9.7, -20.1, 93],
      [8.1, -38.0, 32],
      [23.7, -47.4, 40],
      [51.6, -9.3, 101],
      [-58.4, -14.4, 231],
      [-5.4, -68.4, 222],
      [-8.9, 61.1, 132],
      [-25.1, 60.4, 177],
      [-11.4, 26.4, 100],
      [-13.2, 24.0, 98],
      [-9.2, -1.8, 154],
      [29.7, -4.0, 81],
      [14.5, -11.3, 59],
      [-17.6, -39.9, 110],
      [-44.4, -55.1, 227],
      [31.8, 30.0, 95],
      [46.7, 44.4, 87],
      [46.7, 39.1, 69],
      [53.6, 56.5, 125],
      [16.1, 46.8, 28],
      [14.6, 54.7, 23]
    ].forEach(([lat, lon, diameterKm]) => {
      moon.add(makeMoonSurfaceRing(lat, lon, diameterKm, 0xd7f7ff, 0.58, 56));
    });

    const moonOrbit = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(
        Array.from({ length: 241 }, (_, i) => moonOrbitPoint((i / 240) * Math.PI * 2))
      ),
      new THREE.LineBasicMaterial({
        color: 0x2c7e91,
        transparent: true,
        opacity: 0.22
      })
    );
    moonOrbitPlane.add(moonOrbit);

    function latLonToVector(lat, lon, scale = radius * 1.013) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      return new THREE.Vector3(
        -scale * Math.sin(phi) * Math.cos(theta),
        scale * Math.cos(phi),
        scale * Math.sin(phi) * Math.sin(theta)
      );
    }

    function makeLine(points, color, opacity, closed = false) {
      const vectors = points.map(([lat, lon]) => latLonToVector(lat, lon));
      if (closed && points.length > 1) vectors.push(vectors[0].clone());

      return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(vectors),
        new THREE.LineBasicMaterial({
          color,
          transparent: true,
          opacity
        })
      );
    }

    function makeGraticule() {
      const group = new THREE.Group();
      const color = 0x1b6f86;

      for (let lat = -60; lat <= 60; lat += 20) {
        const points = [];
        for (let lon = -180; lon <= 180; lon += 4) points.push([lat, lon]);
        group.add(makeLine(points, color, 0.42));
      }

      for (let lon = -180; lon < 180; lon += 20) {
        const points = [];
        for (let lat = -80; lat <= 80; lat += 4) points.push([lat, lon]);
        group.add(makeLine(points, color, 0.34));
      }

      return group;
    }

    const fallbackLandShapes = [
      [[72,-168],[70,-142],[60,-124],[51,-130],[44,-124],[32,-117],[25,-105],[18,-97],[13,-85],[9,-79],[18,-73],[26,-81],[31,-89],[38,-96],[45,-104],[54,-110],[61,-126],[68,-150]],
      [[13,-82],[7,-77],[1,-79],[-9,-78],[-18,-72],[-33,-71],[-46,-74],[-55,-68],[-50,-58],[-38,-57],[-24,-47],[-8,-35],[3,-43],[8,-55],[12,-66]],
      [[72,-20],[67,10],[60,28],[50,42],[42,30],[35,12],[36,-7],[45,-15],[55,-24],[65,-32]],
      [[37,-10],[50,4],[58,24],[52,44],[42,61],[31,72],[22,58],[12,43],[3,36],[-11,28],[-28,19],[-35,18],[-35,31],[-25,41],[-5,50],[10,61],[24,80],[34,92],[46,88],[57,70],[64,42],[70,18],[67,-4],[55,-10]],
      [[36,32],[25,36],[12,43],[5,48],[-12,42],[-26,31],[-34,22],[-34,14],[-20,12],[-3,11],[12,18],[25,25]],
      [[8,72],[20,79],[29,88],[23,97],[9,91],[6,80]],
      [[55,70],[62,95],[59,124],[48,140],[35,124],[26,104],[35,86]],
      [[45,126],[37,139],[30,121],[21,106],[12,103],[3,112],[-6,107],[-8,96],[2,88],[16,97],[28,103]],
      [[-11,112],[-18,123],[-30,134],[-39,145],[-36,154],[-22,153],[-13,143],[-13,130]],
      [[-13,48],[-20,47],[-25,43],[-21,49],[-15,51]],
      [[-61,-62],[-64,-18],[-66,48],[-63,112],[-70,160],[-75,-150],[-72,-92]],
      [[76,-44],[80,-20],[77,15],[72,28],[68,5],[70,-28]]
    ];

    earth.add(makeGraticule());

    const coastlines = new THREE.Group();
    earth.add(coastlines);

    function addFallbackCoastlines() {
      fallbackLandShapes.forEach((shape) => {
        coastlines.add(makeLine(shape, 0x82f7ff, 0.9, true));
      });
    }

    function addGeoJsonPolygonRing(ring, color, opacity) {
      if (ring.length < 2) return;

      const points = ring.map(([lon, lat]) => [lat, lon]);
      coastlines.add(makeLine(points, color, opacity, false));
    }

    function drawCountryGeometry(geometry) {
      if (geometry.type === 'Polygon') {
        geometry.coordinates.forEach((ring) => addGeoJsonPolygonRing(ring, 0x82f7ff, 0.92));
      }

      if (geometry.type === 'MultiPolygon') {
        geometry.coordinates.forEach((polygon) => {
          polygon.forEach((ring) => addGeoJsonPolygonRing(ring, 0x82f7ff, 0.92));
        });
      }
    }

    async function loadAccurateCoastlines() {
      try {
        const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        if (!response.ok) throw new Error(`World map request failed: ${response.status}`);

        const world = await response.json();
        const countries = topojson.feature(world, world.objects.countries);
        countries.features.forEach((feature) => drawCountryGeometry(feature.geometry));
      } catch (error) {
        console.warn('Using fallback continent outlines because world-atlas failed to load.', error);
        addFallbackCoastlines();
      }
    }

    loadAccurateCoastlines();

    const satelliteLayer = new THREE.Group();
    earthSystem.add(satelliteLayer);
    let usingRealSatellites = false;
    let visibleSatelliteNames = [];

    function makeSatelliteShell({ count, altitude, spread, color, size, opacity, speed }) {
      const shell = new THREE.Group();
      shell.userData.speed = speed;

      const positions = [];
      const names = [];
      for (let i = 0; i < count; i += 1) {
        const orbitRadius = radius + altitude + (Math.random() - 0.5) * spread;
        const phase = Math.random() * Math.PI * 2;
        const inclination = THREE.MathUtils.degToRad(-70 + Math.random() * 140);
        const node = Math.random() * Math.PI * 2;
        const point = new THREE.Vector3(Math.cos(phase) * orbitRadius, 0, Math.sin(phase) * orbitRadius);

        point.applyAxisAngle(new THREE.Vector3(1, 0, 0), inclination);
        point.applyAxisAngle(new THREE.Vector3(0, 1, 0), node);
        positions.push(point.x, point.y, point.z);
        names.push(`Visual satellite ${String(i + 1).padStart(3, '0')}`);
      }

      const satellites = new THREE.Points(
        new THREE.BufferGeometry(),
        new THREE.PointsMaterial({
          color,
          size,
          transparent: true,
          opacity
        })
      );
      satellites.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      satellites.userData.names = names;
      satellites.userData.source = 'Visual fallback';
      shell.add(satellites);
      return shell;
    }

    const fallbackSatelliteShells = [
      { count: 720, altitude: 0.35, spread: 0.55, color: 0xaaf7ff, size: 0.016, opacity: 0.78, speed: 0.006 },
      { count: 120, altitude: 1.55, spread: 0.5, color: 0x78dfff, size: 0.018, opacity: 0.62, speed: 0.0022 },
      { count: 80, altitude: 3.05, spread: 0.25, color: 0xfff1a8, size: 0.02, opacity: 0.72, speed: 0.001 },
      { count: 60, altitude: 4.6, spread: 0.7, color: 0x7bb7ff, size: 0.017, opacity: 0.45, speed: 0.00055 }
    ];

    function loadFallbackSatellites() {
      usingRealSatellites = false;
      realSatellites.splice(0, realSatellites.length);
      visibleSatelliteNames = [];
      satelliteLayer.clear();
      fallbackSatelliteShells.forEach((shellConfig) => satelliteLayer.add(makeSatelliteShell(shellConfig)));
      satelliteStatus.textContent = 'satellites visual fallback';
      satelliteStatus.title = 'Visual fallback';
    }

    const realSatelliteGeometry = new THREE.BufferGeometry();
    const realSatelliteMaterial = new THREE.PointsMaterial({
      color: 0xaaf7ff,
      size: 0.012,
      transparent: true,
      opacity: 0.78,
      sizeAttenuation: true
    });
    const realSatellitePoints = new THREE.Points(realSatelliteGeometry, realSatelliteMaterial);
    const realSatellites = [];
    const realSatelliteLimit = 1200;
    let satelliteApi = null;

    async function getSatelliteApi() {
      if (satelliteApi) return satelliteApi;

      satelliteApi = window.satellite || window.satellitejs || null;
      if (satelliteApi) return satelliteApi;

      try {
        satelliteApi = await import('https://cdn.jsdelivr.net/npm/satellite.js@5/+esm');
      } catch (error) {
        console.warn('Could not import satellite.js module.', error);
      }

      return satelliteApi;
    }

    function parseTleSet(tleText) {
      const lines = tleText
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
      const records = [];

      for (let i = 0; i < lines.length - 2; i += 3) {
        if (!lines[i + 1].startsWith('1 ') || !lines[i + 2].startsWith('2 ')) continue;

        try {
          records.push({
            name: lines[i],
            satrec: satelliteApi.twoline2satrec(lines[i + 1], lines[i + 2])
          });
        } catch (error) {
          console.warn('Skipping invalid TLE record.', lines[i], error);
        }
      }

      return records;
    }

    function sampleSatellites(records, limit) {
      if (records.length <= limit) return records;

      const sampled = [];
      const step = records.length / limit;
      for (let i = 0; i < limit; i += 1) {
        sampled.push(records[Math.floor(i * step)]);
      }
      return sampled;
    }

    const satelliteSources = {
      'local-starlink': [
        { label: 'local Starlink TLE cache', url: 'active.tle' }
      ],
      'active-live': [
        { label: 'CelesTrak active', url: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle' }
      ],
      'starlink-live': [
        { label: 'CelesTrak Starlink', url: 'https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle' }
      ]
    };

    async function fetchTleFromSources(sourceKey) {
      const sources = satelliteSources[sourceKey] || satelliteSources['local-starlink'];

      for (const source of sources) {
        try {
          const response = await fetch(source.url);
          if (!response.ok) throw new Error(`${source.label} request failed: ${response.status}`);
          return {
            label: source.label,
            text: await response.text()
          };
        } catch (error) {
          console.warn(`Could not load ${source.label}.`, error);
        }
      }

      throw new Error('No TLE source could be loaded.');
    }

    async function loadSatelliteSource(sourceKey = satelliteSourceInput.value) {
      if (sourceKey === 'fallback') {
        loadFallbackSatellites();
        return;
      }

      satelliteApi = await getSatelliteApi();
      if (!satelliteApi) {
        console.warn('satellite.js did not load; using visual fallback satellites.');
        loadFallbackSatellites();
        return;
      }

      try {
        const tleSource = await fetchTleFromSources(sourceKey);
        const records = sampleSatellites(parseTleSet(tleSource.text), realSatelliteLimit);
        if (!records.length) throw new Error('No active satellite TLE records were parsed.');

        realSatellites.splice(0, realSatellites.length, ...records);
        visibleSatelliteNames = records.map((record) => record.name);
        satelliteLayer.clear();
        satelliteLayer.add(realSatellitePoints);
        realSatellitePoints.userData.names = visibleSatelliteNames;
        realSatellitePoints.userData.source = tleSource.label;
        usingRealSatellites = true;
        satelliteStatus.textContent = `satellites ${records.length.toLocaleString()} real TLE`;
        satelliteStatus.title = tleSource.label;
      } catch (error) {
        console.warn('Using fallback satellite shells because real TLE data failed to load.', error);
        loadFallbackSatellites();
      }
    }

    function updateRealSatellites(date) {
      if (!usingRealSatellites || !realSatellites.length) return;

      const positions = [];
      const names = [];
      const earthRadiusKm = 6371;
      const modelScale = radius / earthRadiusKm;
      if (!satelliteApi) return;

      realSatellites.forEach(({ name, satrec }) => {
        const propagated = satelliteApi.propagate(satrec, date);
        const position = propagated && propagated.position;
        if (!position) return;

        positions.push(
          position.x * modelScale,
          position.z * modelScale,
          -position.y * modelScale
        );
        names.push(name);
      });

      visibleSatelliteNames = names;
      realSatelliteGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      realSatelliteGeometry.computeBoundingSphere();
      realSatellitePoints.userData.names = visibleSatelliteNames;
    }

    loadFallbackSatellites();
    loadSatelliteSource();

    const distanceLines = new THREE.Group();
    solarSystem.add(distanceLines);

    const earthMoonLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
      new THREE.LineBasicMaterial({
        color: 0x8df2ff,
        transparent: true,
        opacity: 0.34
      })
    );
    distanceLines.add(earthMoonLine);

    const earthSunLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
      new THREE.LineBasicMaterial({
        color: 0xffd45a,
        transparent: true,
        opacity: 0.2
      })
    );
    distanceLines.add(earthSunLine);

    function updateLine(line, start, end) {
      line.geometry.dispose();
      line.geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
    }

    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.075;
    const mouse = new THREE.Vector2();
    const cameraFocus = {
      mode: 'earth',
      object: null,
      index: -1,
      name: '',
      targetPosition: new THREE.Vector3(0, 0, 0),
      desiredPosition: new THREE.Vector3(0, 0, camera.position.z)
    };

    function getSatellitePointObjects() {
      const pointObjects = [];
      satelliteLayer.traverse((child) => {
        if (child.isPoints) pointObjects.push(child);
      });
      return pointObjects;
    }

    function getSatelliteHit(event) {
      if (!satelliteLayer.visible) return null;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(getSatellitePointObjects(), true);
      if (!intersects.length) return null;

      const hit = intersects[0];
      const names = hit.object.userData.names || [];
      return {
        object: hit.object,
        index: hit.index,
        name: names[hit.index] || hit.object.userData.source || 'Satellite'
      };
    }

    function getSatelliteWorldPosition(object, index) {
      const position = object.geometry.getAttribute('position');
      if (!position || index < 0 || index >= position.count) return null;

      const localPosition = new THREE.Vector3().fromBufferAttribute(position, index);
      return object.localToWorld(localPosition);
    }

    function hideHoverLabel() {
      hoverLabel.style.display = 'none';
      hoverLabel.textContent = '';
    }

    function updateSatelliteHover(event) {
      if (pointer.active) return;

      const hit = getSatelliteHit(event);
      if (!hit) {
        hideHoverLabel();
        return;
      }

      hoverLabel.textContent = hit.name;
      hoverLabel.style.left = `${event.clientX + 12}px`;
      hoverLabel.style.top = `${event.clientY + 12}px`;
      hoverLabel.style.display = 'block';
    }

    function focusEarth() {
      cameraFocus.mode = 'earth';
      cameraFocus.object = null;
      cameraFocus.index = -1;
      cameraFocus.name = '';
      selectedSatellite.textContent = 'selected none';
      hideHoverLabel();
    }

    function focusSatellite(hit) {
      cameraFocus.mode = 'satellite';
      cameraFocus.object = hit.object;
      cameraFocus.index = hit.index;
      cameraFocus.name = hit.name;
      selectedSatellite.textContent = `selected ${hit.name}`;
      hoverLabel.textContent = hit.name;
      hoverLabel.style.display = 'block';
    }

    function updateCameraFocus() {
      if (cameraFocus.mode === 'satellite' && cameraFocus.object) {
        const target = getSatelliteWorldPosition(cameraFocus.object, cameraFocus.index);
        if (!target) {
          focusEarth();
          return;
        }

        cameraFocus.targetPosition.copy(target);
        const direction = target.clone().normalize();
        if (direction.lengthSq() < 0.0001) direction.set(0, 0, 1);
        cameraFocus.desiredPosition.copy(target).add(direction.multiplyScalar(0.72));
      } else {
        cameraFocus.targetPosition.set(0, 0, 0);
        cameraFocus.desiredPosition.set(0, 0, THREE.MathUtils.clamp(getDefaultCameraZ() + zoomOffset, 2.25, 36));
      }

      camera.position.lerp(cameraFocus.desiredPosition, 0.08);
      camera.lookAt(cameraFocus.targetPosition);
    }

    const pointer = {
      active: false,
      id: null,
      x: 0,
      y: 0,
      startX: 0,
      startY: 0,
      moved: false
    };

    renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault());

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;

      const hit = getSatelliteHit(event);
      if (hit) {
        focusSatellite(hit);
      }

      pointer.active = true;
      pointer.id = event.pointerId;
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.startX = event.clientX;
      pointer.startY = event.clientY;
      pointer.moved = false;
      container.classList.add('dragging');
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('pointermove', (event) => {
      updateSatelliteHover(event);
      if (!pointer.active || event.pointerId !== pointer.id) return;

      const dx = event.clientX - pointer.x;
      const dy = event.clientY - pointer.y;
      const totalDx = event.clientX - pointer.startX;
      const totalDy = event.clientY - pointer.startY;
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.moved = pointer.moved || Math.hypot(totalDx, totalDy) > 4;

      if (!pointer.moved && cameraFocus.mode === 'satellite') return;

      solarSystem.rotation.y += dx * 0.006;
      solarSystem.rotation.x += dy * 0.006;
      solarSystem.rotation.x = THREE.MathUtils.clamp(solarSystem.rotation.x, -Math.PI * 0.48, Math.PI * 0.48);
    });

    function stopDrag(event) {
      if (!pointer.active || event.pointerId !== pointer.id) return;

      pointer.active = false;
      pointer.id = null;
      container.classList.remove('dragging');
      renderer.domElement.releasePointerCapture(event.pointerId);
    }

    renderer.domElement.addEventListener('pointerup', stopDrag);
    renderer.domElement.addEventListener('pointercancel', stopDrag);
    renderer.domElement.addEventListener('pointerleave', hideHoverLabel);

    renderer.domElement.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (cameraFocus.mode === 'satellite') {
        focusEarth();
      }
      zoomOffset += Math.sign(event.deltaY) * 0.28;
      zoomOffset = THREE.MathUtils.clamp(zoomOffset, -4.2, 12);
      applyCameraDistance();
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
      applyCameraDistance();
    });

    const simulation = {
      startDate: new Date(),
      startPerformance: performance.now(),
      timeScale: 3600,
      matchActualTime: false,
      earthSiderealDaySeconds: 86164.0905,
      moonSiderealOrbitSeconds: 27.321661 * 86400,
      earthSiderealYearSeconds: 365.256363004 * 86400,
      sunRadiusRatioToEarth,
      astronomicalUnitInEarthRadii,
      sunRadius: sunDisplayRadius,
      earthSunDistance
    };

    const timeScaleSteps = [1, 60, 600, 1800, 3600, 21600, 86400];

    function resetSimulationClock(nextScale = simulation.timeScale) {
      simulation.startDate = new Date();
      simulation.startPerformance = performance.now();
      simulation.timeScale = nextScale;
    }

    function updateTimeScaleLabel() {
      timeScaleValue.textContent = `${simulation.timeScale}x`;
    }

    timeScaleInput.addEventListener('input', () => {
      const nextScale = timeScaleSteps[Number(timeScaleInput.value)];
      actualTimeInput.checked = false;
      simulation.matchActualTime = false;
      resetSimulationClock(nextScale);
      updateTimeScaleLabel();
    });

    slowTimeButton.addEventListener('click', () => {
      const nextIndex = Math.max(0, Number(timeScaleInput.value) - 1);
      timeScaleInput.value = String(nextIndex);
      timeScaleInput.dispatchEvent(new Event('input'));
    });

    earthFocusButton.addEventListener('click', focusEarth);

    actualTimeInput.addEventListener('change', () => {
      simulation.matchActualTime = actualTimeInput.checked;
      if (!simulation.matchActualTime) {
        resetSimulationClock(simulation.timeScale);
      }
    });

    distanceLinesInput.addEventListener('change', () => {
      distanceLines.visible = distanceLinesInput.checked;
    });

    satellitesInput.addEventListener('change', () => {
      satelliteLayer.visible = satellitesInput.checked;
      if (!satellitesInput.checked) {
        focusEarth();
        hideHoverLabel();
      }
    });

    satelliteSourceInput.addEventListener('change', () => {
      focusEarth();
      hideHoverLabel();
      satelliteStatus.textContent = 'satellites loading...';
      loadSatelliteSource();
    });

    updateTimeScaleLabel();
    distanceLines.visible = distanceLinesInput.checked;
    satelliteLayer.visible = satellitesInput.checked;

    function formatClock(date) {
      const two = (value) => String(value).padStart(2, '0');
      return [
        two(date.getMonth() + 1),
        two(date.getDate()),
        two(date.getFullYear() % 100),
        two(date.getHours()),
        two(date.getMinutes()),
        two(date.getSeconds())
      ].join('/');
    }

    function animate(now) {
      const currentDate = new Date();
      const simulatedElapsedSeconds = simulation.matchActualTime
        ? (currentDate.getTime() / 1000)
        : ((now - simulation.startPerformance) / 1000) * simulation.timeScale;
      const simulatedDate = simulation.matchActualTime
        ? currentDate
        : new Date(simulation.startDate.getTime() + simulatedElapsedSeconds * 1000);
      const earthAngle = (simulatedElapsedSeconds / simulation.earthSiderealDaySeconds) * Math.PI * 2;
      const moonAngle = (simulatedElapsedSeconds / simulation.moonSiderealOrbitSeconds) * Math.PI * 2 - 1.0;
      const solarOrbitAngle = (simulatedElapsedSeconds / simulation.earthSiderealYearSeconds) * Math.PI * 2 + Math.PI / 2 + 0.12;
      const sunPosition = earthSunOrbitPoint(solarOrbitAngle).multiplyScalar(-1);

      sun.position.copy(sunPosition);
      earth.rotation.y = earthAngle;
      moon.position.copy(moonOrbitPoint(moonAngle));
      moon.rotation.y = -moonAngle;
      sun.rotation.y += 0.00035;
      clock.textContent = formatClock(simulatedDate);
      const normalizedSunDirection = ((THREE.MathUtils.radToDeg(solarOrbitAngle) % 360) + 360) % 360;
      sunDirection.textContent = `direction ${normalizedSunDirection.toFixed(1)} deg`;
      sunDistance.textContent = `distance ${(earthSunDistance / radius).toLocaleString(undefined, { maximumFractionDigits: 0 })} Earth radii`;

      const moonWorld = new THREE.Vector3();
      moon.getWorldPosition(moonWorld);
      solarSystem.worldToLocal(moonWorld);
      updateLine(earthMoonLine, new THREE.Vector3(0, 0, 0), moonWorld);
      updateLine(earthSunLine, new THREE.Vector3(0, 0, 0), sun.position.clone());

      updateRealSatellites(simulatedDate);
      if (!usingRealSatellites) {
        satelliteLayer.children.forEach((shell, index) => {
          shell.rotation.y += shell.userData.speed;
          shell.rotation.x += shell.userData.speed * 0.17 * (index % 2 === 0 ? 1 : -1);
        });
      }
      updateCameraFocus();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window._globe = { scene, camera, renderer, solarSystem, sun, earthSystem, earth, moon, satelliteLayer, realSatellites, simulation };
  </script>
</body>
</html>
